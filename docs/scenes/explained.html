<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;600;700&display=block"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 960px;
        height: 540px;
        overflow: hidden;
        background: #071b2b;
      }
      body {
        font-family: 'Space Grotesk', Helvetica, Arial, sans-serif;
        color: #f4f7f5;
        position: relative;
        background-image:
          linear-gradient(rgba(85, 223, 189, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(85, 223, 189, 0.06) 1px, transparent 1px);
        background-size: 40px 40px;
      }
      .bar {
        position: absolute;
        left: 0;
        top: 0;
        width: 8px;
        height: 540px;
        background: #55dfbd;
      }
      .top {
        position: absolute;
        left: 36px;
        top: 22px;
        font-size: 15px;
        color: #abc0c8;
        font-weight: 600;
      }
      svg.stage {
        position: absolute;
        left: 0;
        top: 50px;
      }
      .cap {
        position: absolute;
        left: 36px;
        right: 36px;
        top: 432px;
        font-size: 30px;
        font-weight: 700;
        line-height: 1.2;
        opacity: 0;
      }
      .m {
        color: #55dfbd;
      }
      .c {
        color: #fb8176;
      }
      .g {
        color: #ffc56e;
      }
      .dots {
        position: absolute;
        left: 36px;
        bottom: 18px;
      }
      .dots i {
        display: inline-block;
        width: 26px;
        height: 6px;
        border-radius: 3px;
        background: #214456;
        margin-right: 6px;
      }
      .dots i.on {
        background: #55dfbd;
      }
      .sig {
        position: absolute;
        right: 36px;
        bottom: 14px;
        font-size: 13px;
        color: #55dfbd;
        font-weight: 600;
      }
      text {
        font-family: 'Space Grotesk', Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: 'JetBrains Mono', Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <div class="bar"></div>
    <div class="top">laya-server · explained</div>
    <svg class="stage" width="960" height="380" viewBox="0 0 960 380">
      <defs>
        <symbol id="robot" viewBox="0 0 100 130">
          <line x1="50" y1="4" x2="50" y2="20" stroke="#55DFBD" stroke-width="4" />
          <circle cx="50" cy="6" r="6" fill="#55DFBD" />
          <rect
            x="14"
            y="20"
            width="72"
            height="54"
            rx="14"
            fill="#0D2638"
            stroke="#55DFBD"
            stroke-width="4"
          />
          <circle cx="36" cy="46" r="7" fill="#55DFBD" />
          <circle cx="64" cy="46" r="7" fill="#55DFBD" />
          <path
            d="M38 62 Q50 68 62 62"
            stroke="#55DFBD"
            stroke-width="4"
            fill="none"
            stroke-linecap="round"
          />
          <rect
            x="24"
            y="80"
            width="52"
            height="46"
            rx="10"
            fill="#123448"
            stroke="#214456"
            stroke-width="3"
          />
        </symbol>
        <symbol id="person" viewBox="0 0 100 130">
          <circle cx="50" cy="32" r="24" fill="#ABC0C8" />
          <circle cx="42" cy="30" r="3.5" fill="#071B2B" />
          <circle cx="58" cy="30" r="3.5" fill="#071B2B" />
          <path
            d="M41 40 Q50 46 59 40"
            stroke="#071B2B"
            stroke-width="3"
            fill="none"
            stroke-linecap="round"
          />
          <rect
            x="18"
            y="62"
            width="64"
            height="64"
            rx="22"
            fill="#123448"
            stroke="#214456"
            stroke-width="3"
          />
        </symbol>
        <marker
          id="ar"
          viewBox="0 0 10 10"
          refX="8"
          refY="5"
          markerWidth="6"
          markerHeight="6"
          orient="auto"
        >
          <path d="M0 0L10 5L0 10z" fill="#55DFBD" />
        </marker>
      </defs>
      <g id="b1">
        <rect x="60" y="80" width="300" height="230" rx="16" fill="#0D2638" stroke="#214456" stroke-width="2" />
        <path d="M100 80 V50 H150 V80 M190 80 V40 H240 V80" fill="#123448" stroke="#214456" stroke-width="2" />
        <text x="210" y="125" font-size="22" font-weight="700" fill="#F4F7F5" text-anchor="middle">Video factory</text>
        <text x="210" y="152" font-size="16" fill="#ABC0C8" text-anchor="middle">ADN Generator</text>
        <rect x="130" y="175" width="160" height="100" rx="12" fill="#123448" stroke="#55DFBD" stroke-width="3" />
        <path d="M195 200 L235 225 L195 250 Z" fill="#55DFBD" />
        <g id="q1">
          <rect x="420" y="110" width="440" height="110" rx="22" fill="#F4F7F5" />
          <path d="M440 220 L420 252 L470 220 Z" fill="#F4F7F5" />
          <text x="640" y="160" font-size="28" font-weight="700" fill="#071B2B" text-anchor="middle">Does the start</text>
          <text x="640" y="198" font-size="28" font-weight="700" fill="#071B2B" text-anchor="middle">grab you?</text>
          <text x="640" y="290" font-size="18" fill="#ABC0C8" text-anchor="middle">gate G2 · the hook</text>
        </g>
      </g>
      <g id="b2">
        <rect x="80" y="70" width="320" height="210" rx="16" fill="#0D2638" stroke="#55DFBD" stroke-width="3" />
        <rect x="200" y="280" width="80" height="30" fill="#123448" />
        <rect x="150" y="308" width="180" height="14" rx="7" fill="#214456" />
        <text x="240" y="108" font-size="22" font-weight="700" fill="#F4F7F5" text-anchor="middle" class="mono">WAR</text>
        <use href="#robot" x="185" y="120" width="110" height="143" />
        <rect x="470" y="90" width="300" height="120" rx="22" fill="#0D2638" stroke="#55DFBD" stroke-width="3" />
        <text x="560" y="166" font-size="44" fill="#55DFBD" style="font-family: 'Archivo Black', sans-serif">YES</text>
        <g transform="translate(720 150)"><circle r="30" fill="#55DFBD" /><path d="M-14 0 L-4 11 L15 -11" stroke="#071B2B" stroke-width="6" fill="none" stroke-linecap="round" /></g>
        <text x="470" y="260" font-size="20" fill="#ABC0C8">free · stays on Cris's PC</text>
        <text x="470" y="290" font-size="20" fill="#ABC0C8">short yes/no or pick-one questions</text>
      </g>
      <g id="b3">
        <rect x="80" y="40" width="200" height="300" rx="10" fill="#F4F7F5" />
        <g stroke="#ABC0C8" stroke-width="8" stroke-linecap="round">
          <line x1="105" y1="80" x2="255" y2="80" /><line x1="105" y1="110" x2="235" y2="110" /><line x1="105" y1="140" x2="255" y2="140" />
          <line x1="105" y1="170" x2="225" y2="170" /><line x1="105" y1="200" x2="255" y2="200" /><line x1="105" y1="230" x2="245" y2="230" />
          <line x1="105" y1="260" x2="255" y2="260" /><line x1="105" y1="290" x2="215" y2="290" />
        </g>
        <text x="180" y="370" font-size="18" fill="#ABC0C8" text-anchor="middle">long script · G1, G3</text>
        <use href="#robot" x="330" y="170" width="100" height="130" />
        <text x="380" y="330" font-size="16" fill="#ABC0C8" text-anchor="middle">Laya</text>
        <text id="hmm" x="380" y="150" font-size="44" fill="#FFC56E" text-anchor="middle" style="font-family: 'Archivo Black', sans-serif">?</text>
        <path id="up" d="M440 220 C 520 220 560 160 620 140" stroke="#55DFBD" stroke-width="5" fill="none" marker-end="url(#ar)" />
        <g id="cloud">
          <path d="M660 190 a55 55 0 0 1 20 -105 a70 70 0 0 1 130 -10 a55 55 0 0 1 60 115 Z" fill="#123448" stroke="#55DFBD" stroke-width="3" />
          <text x="765" y="160" font-size="34" font-weight="700" fill="#F4F7F5" text-anchor="middle">Jev</text>
          <text x="765" y="240" font-size="18" fill="#ABC0C8" text-anchor="middle">bigger judge, in the cloud</text>
        </g>
      </g>
      <g id="b4">
        <rect x="80" y="70" width="260" height="240" rx="12" fill="#0D2638" stroke="#FFC56E" stroke-width="3" />
        <g stroke="#214456" stroke-width="4"><line x1="110" y1="200" x2="310" y2="200" /><line x1="110" y1="240" x2="310" y2="240" /><line x1="110" y1="280" x2="310" y2="280" /></g>
        <ellipse cx="210" cy="115" rx="50" ry="26" fill="none" stroke="#FFC56E" stroke-width="5" />
        <circle cx="210" cy="115" r="12" fill="#FFC56E" />
        <text x="120" y="188" font-size="18" fill="#F4F7F5" class="mono">G2 hook → saved</text>
        <text x="120" y="228" font-size="18" fill="#F4F7F5" class="mono">G6 comments → saved</text>
        <text x="210" y="345" font-size="18" fill="#ABC0C8" text-anchor="middle">shadow notebook</text>
        <rect id="vid" x="520" y="150" width="140" height="90" rx="12" fill="#123448" stroke="#55DFBD" stroke-width="3" />
        <path id="play" d="M575 172 L610 195 L575 218 Z" fill="#55DFBD" />
        <path d="M420 195 H880" stroke="#55DFBD" stroke-width="4" stroke-dasharray="10 10" />
        <text x="650" y="300" font-size="20" fill="#ABC0C8" text-anchor="middle">the video keeps going · nothing is blocked</text>
      </g>
    </svg>

    <div class="cap" id="c1">Cris's <span class="m">video factory</span> asks short questions about each video.</div>
    <div class="cap" id="c2">A small <span class="m">free judge</span> on his PC, WAR, answers right away.</div>
    <div class="cap" id="c3">Too long, or not sure? It passes the question to <span class="m">Jev</span>.</div>
    <div class="cap" id="c4"><span class="g">Shadow mode:</span> it writes answers down but blocks nothing.</div>

    <div class="dots"><i id="d1"></i><i id="d2"></i><i id="d3"></i><i id="d4"></i></div>
    <div class="sig">Cristian Guerra · QA · Medellín</div>

    <script>
      const t = parseFloat(new URLSearchParams(location.search).get('t') ?? '99');
      const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));
      const $ = (id) => document.getElementById(id);
      const vis = (a, b) => Math.min(ease((t - a) / 0.35), b == null ? 1 : ease((b - t) / 0.35));
      const beats = [
        [0, 3],
        [3, 6],
        [6, 9],
        [9, null],
      ];
      beats.forEach(([a, b], i) => {
        const o = vis(a, b);
        $('b' + (i + 1)).style.opacity = o;
        $('c' + (i + 1)).style.opacity = o;
        if (t >= a) $('d' + (i + 1)).classList.add('on');
      });
      $('q1').style.opacity = ease((t - 0.8) / 0.4);
      $('hmm').style.opacity = ease((t - 6.6) / 0.3);
      const up = 300 - 300 * ease((t - 7.0) / 0.9);
      $('up').setAttribute('stroke-dasharray', '300');
      $('up').setAttribute('stroke-dashoffset', up);
      $('cloud').style.opacity = ease((t - 7.6) / 0.4);
      const vx = 300 * ease((t - 9.6) / 2.2) - 60;
      $('vid').setAttribute('transform', `translate(${vx} 0)`);
      $('play').setAttribute('transform', `translate(${vx} 0)`);
    </script>
  </body>
</html>
